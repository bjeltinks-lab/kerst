<script type="module">
import { html, render, Component } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';

/* =====================================================================
   API — Supabase (live) of localStorage (demo-modus)
   ===================================================================== */
const CFG = window.KERST_CONFIG || {};
const LIVE = !!CFG.dataRepo;
const BRANCH = CFG.branch || 'main';
const MIN_WISHES = 5;      // minimaal aantal wensen
const MAX_WISHES = 10;
const TOKEN_KEY = 'kerst-sessie';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

class ApiError extends Error { constructor(msg, session) { super(msg); this.session = session; } }

/* Kiest een willekeurige naam voor `me` uit de ongetrokken namen.
   draws = { trekker: { drawn, at } }. Voorkomt dat de laatste trekker
   alleen zichzelf overhoudt. Geeft null als er niets mogelijk is. */
function pickName(names, draws, me, exclude) {
  const taken = Object.values(draws).map((d) => d.drawn);
  const left = names.filter((n) => n !== me && !draws[n]);
  if (left.length === 1 && taken.indexOf(left[0]) < 0) return left[0] !== exclude ? left[0] : null;
  const pool = names.filter((n) => n !== me && n !== exclude && taken.indexOf(n) < 0);
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}
const emptyMember = (name) => ({ name, photo: null, wishes: [], profile_done: false, tour_done: false });

/* ---------------- GitHub-backend ---------------- */
const utf8ToB64 = (str) => { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64ToUtf8 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), (c) => c.charCodeAt(0)));
const b64Bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

let USERS = null;   // users.json: { iterations, users: { Naam: { salt, iv, ct } } }
async function loadUsers() {
  if (USERS) return USERS;
  const r = await fetch('users.json', { cache: 'no-store' }).catch(() => null);
  if (!r || !r.ok) throw new ApiError('Kon de accounts niet laden (users.json ontbreekt?)');
  USERS = await r.json();
  return USERS;
}
const allNames = () => Object.keys(USERS.users);

async function unlockToken(name, password) {
  const u = USERS.users[name];
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64Bytes(u.salt), iterations: USERS.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64Bytes(u.iv) }, key, b64Bytes(u.ct));
  return new TextDecoder().decode(pt);
}

function session() {
  try { const s = JSON.parse(store.get(TOKEN_KEY)); if (s && s.name && s.token) return s; } catch (e) {}
  throw new ApiError('Log opnieuw in', true);
}

async function gh(method, path, body) {
  const s = session();
  let r;
  try {
    r = await fetch('https://api.github.com/repos/' + CFG.dataRepo + '/contents/' + path + (method === 'GET' ? '?ref=' + BRANCH : ''), {
      method, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + s.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw new ApiError('Geen verbinding. Check je internet en probeer opnieuw.'); }
  if (r.status === 401) throw new ApiError('De toegangssleutel werkt niet meer. Vraag Benjamin om hulp.', true);
  return r;
}
async function ghGet(path) {
  const r = await gh('GET', path);
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw new ApiError('Kon de gegevens niet ophalen (' + r.status + ')');
  const j = await r.json();
  return { data: JSON.parse(b64ToUtf8(j.content)), sha: j.sha };
}
async function ghPut(path, data, sha, message) {
  const r = await gh('PUT', path, { message, content: utf8ToB64(JSON.stringify(data, null, 1)), branch: BRANCH, ...(sha ? { sha } : {}) });
  if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (!r.ok) throw new ApiError('Opslaan mislukt (' + r.status + ')');
}
/* lees-wijzig-schrijf met automatisch opnieuw proberen als iemand anders tegelijk schreef */
async function ghUpdate(path, fallback, change, message) {
  for (let attempt = 0; attempt < 6; attempt++) {
    const { data, sha } = await ghGet(path);
    const next = change(data || fallback());
    if (next === undefined) return data || fallback();  // niks te doen
    try { await ghPut(path, next, sha, message); return next; }
    catch (e) { if (!e.conflict) throw e; await sleep(300 + Math.random() * 900); }
  }
  throw new ApiError('Het is even druk, probeer het nog eens');
}

const memberPath = (n) => 'members/' + encodeURIComponent(n) + '.json';
async function getMember(n) { const { data } = await ghGet(memberPath(n)); return Object.assign(emptyMember(n), data || {}, { name: n }); }

async function stateFor(me, knownDraws, knownMe) {
  const [m, draws] = await Promise.all([knownMe || getMember(me), knownDraws || ghGet('draws.json').then((r) => (r.data && r.data.draws) || {})]);
  const d = draws[me];
  let draw = null;
  if (d) { const o = await getMember(d.drawn); draw = { name: d.drawn, photo: o.photo, wishes: o.wishes, drawn_at: d.at }; }
  return { me: m, names: allNames(), draw };
}

async function updateMe(change) {
  const me = session().name;
  const m = await ghUpdate(memberPath(me), () => emptyMember(me), (m) => { change(m); return m; }, 'profiel ' + me);
  return stateFor(me, null, Object.assign(emptyMember(me), m));
}

async function doDraw(redraw) {
  const me = session().name;
  await loadUsers();
  let fail = null;
  const result = await ghUpdate('draws.json', () => ({ draws: {} }), (file) => {
    const draws = Object.assign({}, file.draws);
    if (!redraw && draws[me]) return undefined;           // al getrokken: niks veranderen
    const old = draws[me] && draws[me].drawn;
    delete draws[me];                                     // oude naam terug in de pot
    const p = pickName(allNames(), draws, me, redraw ? old : null);
    if (!p) { fail = redraw && old ? 'Er is geen andere naam meer over, je houdt ' + old : 'Er zitten geen namen meer in de pot'; return undefined; }
    draws[me] = { drawn: p, at: new Date().toISOString() };
    return { draws };
  }, 'trekking');
  if (fail) throw new ApiError(fail);
  return stateFor(me, result.draws);
}

const github = {
  async login(name, password) {
    await loadUsers();
    const real = allNames().find((n) => n.toLowerCase() === String(name).trim().toLowerCase());
    if (!real || !password) throw new ApiError('Naam of wachtwoord klopt niet');
    let token;
    try { token = await unlockToken(real, password); } catch (e) { throw new ApiError('Naam of wachtwoord klopt niet'); }
    const sess = JSON.stringify({ name: real, token });
    store.set(TOKEN_KEY, sess);
    return { token: sess, state: await stateFor(real) };
  },
  async logout() {},
  async state() { await loadUsers(); return stateFor(session().name); },
  saveProfile(wishes, photo) {
    return updateMe((m) => {
      m.wishes = wishes.slice(0, MAX_WISHES).map((w) => w.trim().slice(0, 200));
      if (photo != null) m.photo = photo || null;
      m.profile_done = true;
    });
  },
  tourDone() { return updateMe((m) => { m.tour_done = true; }); },
  draw() { return doDraw(false); },
  redraw() { return doDraw(true); }
};

/* ---------------- demo-backend (localStorage) ---------------- */
const DEMO_NAMES = ['Benjamin', 'Nikola', 'Leonie', 'Dino', 'Harry', 'Francisco', 'Chaimae', 'Estelle', 'Digna', 'Inez'];
const DEMO_WISHES = ['Koptelefoon met noise cancelling', 'Kookboek Ottolenghi Simple', 'Puzzel van 1000 stukjes', 'Thermosfles', 'Planten-hangpot', 'Bordspel Wingspan', 'Geurkaars (houtachtig)', 'Sjaal in donkergroen', 'Etentje-bon', 'Mooi notitieboek'];
const demo = {
  load() {
    let db = null;
    try { db = JSON.parse(store.get('kerst-demo-db')); } catch (e) {}
    if (!db) {
      db = { members: {}, draws: {} };
      DEMO_NAMES.forEach((n) => { db.members[n] = Object.assign(emptyMember(n), { wishes: DEMO_WISHES.slice().sort(() => Math.random() - .5), profile_done: true, tour_done: true }); });
    }
    return db;
  },
  save(db) { store.set('kerst-demo-db', JSON.stringify(db)); },
  stateFor(db, me) {
    const d = db.draws[me];
    return { me: Object.assign({}, db.members[me]), names: DEMO_NAMES.slice(), draw: d ? { name: d.drawn, photo: db.members[d.drawn].photo, wishes: db.members[d.drawn].wishes, drawn_at: d.at } : null };
  },
  async run(fn) {
    await sleep(250);
    const db = this.load();
    const me = session().name;
    const err = fn(db, me);
    if (err) throw new ApiError(err);
    this.save(db);
    return this.stateFor(db, me);
  },
  async login(name, password) {
    await sleep(250);
    const real = DEMO_NAMES.find((n) => n.toLowerCase() === String(name).trim().toLowerCase());
    if (!real || !password) throw new ApiError('Naam of wachtwoord klopt niet');
    const db = this.load();
    if (!db.members[real].fresh) db.members[real] = Object.assign(emptyMember(real), { fresh: true });
    this.save(db);
    const sess = JSON.stringify({ name: real, token: 'demo' });
    store.set(TOKEN_KEY, sess);
    return { token: sess, state: this.stateFor(db, real) };
  },
  async logout() {},
  state() { return this.run(() => null); },
  saveProfile(wishes, photo) { return this.run((db, me) => { const m = db.members[me]; m.wishes = wishes.slice(0, 10); if (photo != null) m.photo = photo || null; m.profile_done = true; }); },
  tourDone() { return this.run((db, me) => { db.members[me].tour_done = true; }); },
  draw() { return this.run((db, me) => { if (db.draws[me]) return; const p = pickName(DEMO_NAMES, db.draws, me, null); if (!p) return 'Er zitten geen namen meer in de pot'; db.draws[me] = { drawn: p, at: new Date().toISOString() }; }); },
  redraw() {
    return this.run((db, me) => {
      const old = db.draws[me] && db.draws[me].drawn;
      const rest = Object.assign({}, db.draws); delete rest[me];
      const p = pickName(DEMO_NAMES, rest, me, old);
      if (!p) return 'Er is geen andere naam meer over, je houdt ' + (old || 'je huidige naam');
      db.draws[me] = { drawn: p, at: new Date().toISOString() };
    });
  }
};

const api = LIVE ? github : demo;

/* foto verkleinen tot 320×320 jpeg (± 25 kB) */
function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const S = 320, c = document.createElement('canvas');
      c.width = c.height = S;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Kon deze foto niet openen')); };
    img.src = url;
  });
}

const Snow = () => html`<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">

/* deeltjes-explosie vanuit een punt */
const BURST_COLORS = ['#E8B98A', '#FBEFE6', '#F2B8B5', '#C9503F', '#FFD58A'];
const BURST = Array.from({ length: 34 }, (_, i) => {
  const a = (i / 34) * Math.PI * 2 + (i % 3) * .2, d = 110 + (i * 37) % 120;
  return { dx: Math.round(Math.cos(a) * d), dy: Math.round(Math.sin(a) * d), r: (i * 97) % 540 - 270, c: BURST_COLORS[i % 5], w: 6 + (i % 3) * 3, h: i % 2 ? 6 : 14, t: (i % 5) * .03 };
});
const Burst = ({ x, y, delay }) => html`<div aria-hidden="true" style="position: absolute; left: ${x}px; top: ${y}px; width: 0; height: 0; pointer-events: none">
  ${BURST.map((p) => html`<span style="position: absolute; left: ${-p.w / 2}px; top: ${-p.h / 2}px; width: ${p.w}px; height: ${p.h}px; border-radius: 2px; background: ${p.c}; --dx: ${p.dx}px; --dy: ${p.dy}px; --r: ${p.r}deg; animation: burst 1.6s cubic-bezier(.1,.8,.3,1) ${delay + p.t}s both"></span>`)}
</div>`;

const CONFETTI = Array.from({ length: 40 }, (_, i) => ({ l: (i * 53) % 390, dx: ((i * 31) % 120) - 60, r: ((i * 131) % 900) - 450, c: BURST_COLORS[i % 5], w: 6 + (i % 3) * 2, h: i % 2 ? 8 : 14, d: 3.2 + (i % 7) * .45, t: (i % 10) * .18 }));
const Confetti = () => html`<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
  ${CONFETTI.map((p) => html`<span style="position: absolute; left: ${p.l}px; top: 0; width: ${p.w}px; height: ${p.h}px; border-radius: 2px; background: ${p.c}; --dx: ${p.dx}px; --r: ${p.r}deg; animation: confetti ${p.d}s cubic-bezier(.3,.2,.6,1) ${p.t}s both"></span>`)}
</div>`;

const LID = [[-176, 'border: 4px solid #A87444'], [-180, 'border: 4px solid #D8A774'], [-184, 'border: 4px solid #B9834F'], [-188, 'border: 4px solid #E8B98A'], [-192, 'background: radial-gradient(circle at 40% 38%, #FFF0D6, #E3B07C 55%, #A87444 100%); border: 2px solid #C99766']];
const disc = (size, y, extra) => html`<span style="${ABS}; width: ${size}px; height: ${size}px; margin: ${-size / 2}px 0 0 ${-size / 2}px; border-radius: 50%; box-sizing: border-box; transform: translateY(${y}px) rotateX(90deg); ${extra}"></span>`;
const JarShadow = () => html`<span style="${ABS}; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; transform: translateY(162px) rotateX(90deg); background: radial-gradient(circle, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 62%)"></span>`;
const JarGlass = () => RINGS.map(([s, y, e]) => disc(s, y, e));
/* ribbels rond de rand, zodat je het losdraaien ziet */
const RIDGES = Array.from({ length: 28 }, (_, i) => i * (360 / 28));
/* `off`: deksel gaat eraf. Vervagen gebeurt per onderdeel, want opacity op de
   3D-groep zelf maakt die plat (dan verdwijnen de schijven). */
const Lid = ({ off }) => {
  const fade = off ? 'animation: lidfade 2s both' : '';
  return [
    ...LID.map(([y, e]) => disc(144, y, e + '; ' + fade)),
    ...RIDGES.map((a, i) => html`<span style="${ABS}; width: 5px; height: 15px; margin: -7.5px 0 0 -2.5px; background: ${i % 2 ? '#8E5E33' : '#F2CB9C'}; transform: translateY(-184px) rotateY(${a}deg) translateZ(72px); ${fade}"></span>`)
  ];
};
const SLIP_POS = [[-60, 136, 30, -25, 56], [10, 138, 52, 10, 60], [70, 134, 20, 30, 52], [-30, 128, -30, -15, 62], [50, 126, -40, 20, 58], [-82, 130, -14, 35, 50], [0, 120, 4, -5, 64], [30, 112, 62, -30, 55], [-50, 112, 58, 15, 60], [84, 118, -12, -20, 54]];
const SLIP_BG = ['linear-gradient(174deg, #FFF9F0 0%, #F4E7D6 47%, #DCC7AE 50%, #FBF1E3 53%, #EEDFCB 100%)', 'linear-gradient(174deg, #EDD0A8 0%, #DDB98D 47%, #C29A6C 50%, #E6C69B 53%, #D6AF80 100%)', 'linear-gradient(174deg, #FBE1DC 0%, #F1C8C1 47%, #D9A9A1 50%, #F7D6D0 53%, #EBC0B8 100%)'];
const slipTf = (i) => { const p = SLIP_POS[i % SLIP_POS.length], k = Math.floor(i / SLIP_POS.length); return `translate3d(${p[0] + k * 14}px,${p[1] - k * 18}px,${p[2]}px) rotateY(${p[3]}deg) rotateX(${p[4]}deg)`; };
const Slip = ({ name, i, o, anim }) => html`<span style="${ABS}; width: 74px; height: 30px; margin: -15px 0 0 -37px; border-radius: 2px; font-family: Caveat, cursive; font-size: ${name.length > 8 ? 17 : 19}px; font-weight: 600; line-height: 1; color: ${C.wine}; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: opacity .6s ease; transform: ${slipTf(i)}; background: ${SLIP_BG[i % 3]}; opacity: ${o == null ? 1 : o}; animation: ${anim || 'none'}">${name}</span>`;
const Glints = ({ o }) => html`
  <span style="${ABS}; width: 13px; height: 210px; margin: -105px 0 0 -6px; border-radius: 99px; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.55) 30%, rgba(255,255,255,.18) 75%, rgba(255,255,255,0)); transition: opacity 1.4s ease; opacity: ${o}; transform: translate3d(-74px, 10px, 104px) rotateY(-36deg)"></span>

/* =====================================================================
   App
   ===================================================================== */
class App extends Component {
  constructor(p) {
    super(p);
    this.timers = [];
    this.state = {
      screen: 'boot', data: null, busy: false, toast: '', loginErr: '',
      name: store.get('kerst-last-name') || '', pass: '',
      vals: Array(MAX_WISHES).fill(''), photo: null, photoChanged: false, editing: false,
      step: 0, count: 0, phase: 'shake', picked: '', mode: 'draw', sheet: false, fromLogin: false
    };
  }

  componentDidMount() {
    if (!store.get(TOKEN_KEY)) return this.setState({ screen: 'login' });
    api.state().then((data) => this.route(data, false)).catch((e) => this.fail(e, true));
  }
  componentWillUnmount() { this.clearTimers(); }
  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }

  toast(msg) {
    this.setState({ toast: msg });
    clearTimeout(this.toastT);
    this.toastT = setTimeout(() => this.setState({ toast: '' }), 4200);
  }
  fail(e, quietToLogin) {
    if (e && e.session) { store.del(TOKEN_KEY); this.setState({ screen: 'login', busy: false, data: null }); if (!quietToLogin) this.toast(e.message); return; }
    this.setState({ busy: false, screen: this.state.screen === 'boot' ? 'login' : this.state.screen });
    this.toast((e && e.message) || 'Er ging iets mis');
  }

  /* bepaal waar iemand heen moet op basis van de serverstaat */
  nextScreen(data) {
    if (!data.me.profile_done) return 'wens';
    if (!data.me.tour_done) return 'tour';
    return data.draw ? 'profiel' : 'pot';
  }
  route(data, viaLogin) {
    const wishes = Array(MAX_WISHES).fill('').map((_, i) => data.me.wishes[i] || '');
    const base = { data, busy: false, vals: wishes, photo: data.me.photo, photoChanged: false, editing: false, sheet: false, count: 0, phase: 'shake', mode: 'draw' };
    this.setState(Object.assign(base, viaLogin ? { screen: 'welkom', fromLogin: true } : { screen: this.nextScreen(data) }));
  }

  /* ---------- acties ---------- */
  login = (e) => {
    e && e.preventDefault();
    const { name, pass } = this.state;
    if (!name.trim() || !pass) return this.setState({ loginErr: 'Vul je naam en wachtwoord in' });
    this.setState({ busy: true, loginErr: '' });
    api.login(name, pass).then((r) => {
      store.set('kerst-last-name', r.state.me.name);
      this.setState({ pass: '' });
      this.route(r.state, true);
    }).catch((err) => this.setState({ busy: false, loginErr: err.message }));
  };
  logout = () => {
    store.del(TOKEN_KEY); this.clearTimers();
    this.setState({ screen: 'login', data: null, sheet: false, busy: false });
  };
  afterWelkom = () => this.setState({ screen: this.nextScreen(this.state.data) });
  pickPhoto = () => this.fileInput && this.fileInput.click();
  onPhoto = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    resizePhoto(f).then((url) => this.setState({ photo: url, photoChanged: true })).catch((err) => this.toast(err.message));
  };
  setWish = (i, v) => { const nx = this.state.vals.slice(); nx[i] = v; this.setState({ vals: nx }); };
  saveWens = () => {
    const S = this.state;
    if (S.busy || S.vals.filter((v) => v.trim()).length < MIN_WISHES) return;
    this.setState({ busy: true });
    api.saveProfile(S.vals.map((v) => v.trim()).filter(Boolean), S.photoChanged ? (S.photo || '') : null).then((data) => {
      const wasEditing = S.editing;
      this.setState({ data, busy: false, photoChanged: false, editing: false, step: 0, screen: wasEditing ? this.nextScreen(data) : (data.me.tour_done ? this.nextScreen(data) : 'tour') });
      if (wasEditing) this.toast('Je verlanglijstje is opgeslagen');
    }).catch((e) => this.fail(e));
  };
  editWens = () => {
    const d = this.state.data;
    this.setState({ screen: 'wens', editing: true, vals: Array(MAX_WISHES).fill('').map((_, i) => d.me.wishes[i] || ''), photo: d.me.photo, photoChanged: false });
  };
  cancelEdit = () => this.setState({ screen: this.nextScreen(this.state.data), editing: false });
  tourNext = () => {
    if (this.state.step < 3) return this.setState({ step: this.state.step + 1 });
    this.setState({ busy: true });
    api.tourDone().then((data) => this.setState({ data, busy: false, screen: data.draw ? 'profiel' : 'pot', count: 0, phase: 'shake', mode: 'draw' })).catch((e) => this.fail(e));
  };

  shake = () => {
    const S = this.state;
    if (S.count >= 3 || S.phase !== 'shake' || S.busy) return;
    const next = S.count + 1;
    if (navigator.vibrate) try { navigator.vibrate(next === 3 ? [40, 30, 60] : 35); } catch (e) {}
    this.setState({ count: next });
    if (next < 3) return;
    this.setState({ busy: true });
    const req = S.mode === 'redraw' ? api.redraw() : api.draw();
    // deksel draait eraf terwijl de server trekt; daarna pas de kijk in de pot
    this.later(950, () => this.setState({ phase: 'lift' }));
    Promise.all([req, sleep(950 + 1750)]).then(([data]) => {
      this.setState({ data, picked: data.draw.name, phase: 'above', busy: false });
      this.later(1950, () => this.setState({ phase: 'float' }));
      this.later(3950, () => this.setState({ phase: 'open' }));
      if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
    }).catch((e) => {
      this.clearTimers();
      this.setState({ phase: 'shake' });
      this.fail(e);
      if (!e.session) {
        // mislukt: oude staat ophalen en terug naar waar je was
        api.state().then((data) => this.setState({ data, count: 0, phase: 'shake', mode: 'draw', screen: data.draw ? 'profiel' : 'pot' })).catch(() => this.setState({ count: 0 }));
      }
    });
  };
  toProfiel = () => { this.clearTimers(); this.setState({ screen: 'profiel', phase: 'shake', count: 0, mode: 'draw' }); };
  redraw = () => this.setState({ sheet: false, screen: 'pot', count: 0, phase: 'shake', mode: 'redraw', picked: '' });
  cancelRedraw = () => this.setState({ screen: 'profiel', mode: 'draw', count: 0 });
  resetDemo = () => { store.del('kerst-demo-db'); store.del(TOKEN_KEY); location.reload(); };

  ${S.screen === 'login' ? this.renderLogin() : null}

  ${S.screen === 'tour' ? this.renderTour() : null}
  ${S.screen === 'pot' ? this.renderPot() : null}
  ${S.screen === 'profiel' ? this.renderProfiel() : null}
  ${!LIVE && S.screen !== 'boot' ? html`<div style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: rgba(0,0,0,.35); color: ${C.rose}; pointer-events: none">Demo-modus</div>` : null}
  ${S.toast ? html`<div role="status" style="position: absolute; left: 20px; right: 20px; top: 40px; z-index: 50; padding: 14px 18px; border-radius: 18px; background: ${C.cream}; color: ${C.wine}; font-size: 14px; font-weight: 600; line-height: 1.4; box-shadow: 0 14px 40px rgba(0,0,0,.4); animation: toastin .3s ease-out both" onClick=${() => this.setState({ toast: '' })}>${S.toast}</div>` : null}

    const example = S.data.names.find((n) => n !== me.name) || 'Nikola';
    const steps = [
      { title: 'Dit is de lootjespot', body: `Alle ${S.data.names.length} namen zitten erin. Wie al door een ander getrokken is, kun je niet krijgen, maar dat zie je niet: het blijft een verrassing.`, spot: [108, 73, 244, 294] },
      { title: 'Schud 3 keer', body: 'Tik op de pot om te schudden. Bij de derde keer springt er een lootje uit.', spot: [398, 146, 98, 34] },
      { title: 'Jouw getrokken naam', body: `Bijvoorbeeld ${example}: je ziet de foto en het verlanglijstje van wie je hebt. Dit blijft staan, elke keer dat je inlogt.`, spot: [432, 14, 362, 88] },
      { title: 'Toch iemand anders?', body: 'Met Opnieuw trekken gaat je naam terug in de pot en krijg je een nieuwe uit de ongetrokken namen.', spot: [516, 14, 362, 68] }
    ];
    const st = steps[S.step], [t, l, w, h] = st.spot;
    const ease = '.55s cubic-bezier(.4,0,.2,1)';
    return html`
<div style="position: absolute; inset: 0; animation: fadein .35s both">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div style="position: absolute; left: 24px; right: 24px; top: 52px; display: flex; justify-content: space-between; align-items: center"><span style="font-size: 22px; ${SERIF}">Lootjes</span><span style="height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid ${C.line}; font-size: 12px; font-weight: 600; display: flex; align-items: center">${me.name}</span></div>
    <div style="position: absolute; left: 0; top: 0; width: 390px; height: 460px; perspective: 900px; perspective-origin: 50% 55%">
      <div style="position: absolute; left: 195px; top: 262px; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(-14deg) scale(.72)">
        <${JarShadow} /><${JarGlass} />
        ${S.data.names.map((n, i) => html`<${Slip} name=${n} i=${i} />`)}
        <${Glints} o=${1} />
        <div style="${ABS}; transform-style: preserve-3d"><${Lid} /></div>
      </div>
    </div>
    <div style="position: absolute; left: 164px; top: 408px; display: flex; gap: 10px">${[0, 1, 2].map(() => html`<span style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid ${C.gold}; box-sizing: border-box"></span>`)}</div>
    <div style="position: absolute; left: 24px; right: 24px; top: 440px; height: 72px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-radius: 28px; background: ${C.cream}; color: ${C.wine}">
      <${Avatar} name=${example} size=${44} font=${18} />
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #8A3B2A">Jij koopt voor</span><span style="font-size: 22px; line-height: 1; ${SERIF}">${example}</span></span>
      <span style="font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 99px; border: 1px solid currentColor; opacity: .75">Voorbeeld</span>
    </div>
    <div style="position: absolute; left: 24px; right: 24px; top: 524px; height: 52px; border-radius: 999px; border: 2px solid ${C.gold}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Opnieuw trekken</div>
  </div>
  <div aria-hidden="true" style="position: absolute; border-radius: 22px; box-shadow: 0 0 0 1600px rgba(20,3,7,.78); transition: top ${ease}, left ${ease}, width ${ease}, height ${ease}; top: ${t}px; left: ${l}px; width: ${w}px; height: ${h}px">
    <span style="position: absolute; inset: 0; border-radius: 22px; border: 2px solid ${C.gold}"></span>
    <span style="position: absolute; inset: -6px; border-radius: 28px; border: 2px solid ${C.gold}; animation: ring 1.8s ease-out infinite"></span>
  </div>
  <div key=${S.step} style="position: absolute; left: 20px; right: 20px; bottom: 22px; background: ${C.cream}; color: ${C.wine}; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.3); animation: cardin .4s ease-out both">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #8A3B2A">Stap ${S.step + 1} van 4</div>
    <h2 style="margin: 0; font-size: 25px; line-height: 1.1; ${SERIF}">${st.title}</h2>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; opacity: .85">${st.body}</p>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
      <div style="display: flex; gap: 6px">${steps.map((_, k) => html`<span style="height: 8px; border-radius: 99px; background: ${C.wine}; transition: width .3s, opacity .3s; width: ${k === S.step ? 22 : 8}px; opacity: ${k === S.step ? 1 : .3}"></span>`)}</div>
      <div style="display: flex; gap: 4px">
        ${S.step > 0 ? html`<button type="button" onClick=${() => this.setState({ step: S.step - 1 })} style="height: 48px; padding: 0 14px; border: 0; background: transparent; color: ${C.wine}; font: 600 15px 'DM Sans', sans-serif; cursor: pointer">Terug</button>` : null}
        <button type="button" onClick=${this.tourNext} disabled=${S.busy} style="height: 48px; min-width: 110px; padding: 0 22px; border: 0; border-radius: 999px; background: ${C.wine}; color: ${C.cream}; font: 600 15px 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center">${S.busy ? html`<${Spinner} />` : S.step === 3 ? 'Aan de slag' : 'Volgende'}</button>
      </div>
    </div>
  </div>
</div>`;
  }

  renderPot() {
    const S = this.state, names = S.data.names, ph = S.phase, c = S.count;
    const shaking = c > 0 && ph === 'shake';
    const up = ph === 'above' || ph === 'float' || ph === 'open';
    const floating = ph === 'float' || ph === 'open';
    const hints = ['Tik op de pot om te schudden', 'Nog 2 keer schudden…', 'Nog 1 keer!', 'Het deksel gaat eraf…'];
    const phaseHint = { lift: 'Het deksel gaat eraf…', above: 'Je kijkt in de pot…', float: 'Er zweeft een lootje omhoog…' };
    const hint = phaseHint[ph] || hints[Math.min(c, 3)];
    const cam = up ? 'translateY(-10px) rotateX(-89deg) scale(1)' : 'translateY(14px) rotateX(-14deg) scale(.9)';
    const jarAnim = shaking ? ((c % 2 ? 'shakeA' : 'shakeB') + (c === 3 ? ' .9s' : ' .6s') + ' ease-in-out') : 'none';
    const lotT = floating ? 'translateY(-250px) rotateX(90deg) rotateZ(0deg)' : 'translateY(132px) rotateX(90deg) rotateZ(-24deg)';
    const picked = S.picked;
    const lotName = `display: flex; align-items: center; justify-content: center; font-family: Caveat, cursive; font-weight: 600; font-size: ${picked.length > 7 ? 46 : 58}px; color: ${C.wine}`;
    return html`
<div style="position: absolute; inset: 0; padding: 52px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; animation: fadein .35s both">
  <${Header} me=${S.data.me} onMe=${this.editWens} right=${S.mode === 'redraw' && ph === 'shake' && c === 0 ? html`<button type="button" onClick=${this.cancelRedraw} style="height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid ${C.line}; background: transparent; color: ${C.cream}; font: 600 12px 'DM Sans', sans-serif; cursor: pointer">Annuleren</button>` : (ph !== 'shake' || c > 0 ? html`<span></span>` : null)} />
  <div style="height: 34px; margin-top: 14px; display: flex; align-items: center; justify-content: center; text-align: center">
    ${ph === 'open' ? html`<div style="${EYEBROW}; animation: fadeup .6s ease-out .5s both">Jij hebt getrokken</div>`
      : S.mode === 'redraw' ? html`<p style="margin: 0; font-size: 14px; color: ${C.rose}">Opnieuw trekken · je krijgt een <strong style="color: ${C.gold}">nieuwe naam</strong></p>`
      : html`<p style="margin: 0; font-size: 14px; color: ${C.rose}">Alle <strong style="color: ${C.gold}">${names.length} namen</strong> zitten in de pot</p>`}
  </div>
  <div style="position: relative; width: 342px; height: 450px; flex: none; perspective: 900px; perspective-origin: 50% 45%">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 30px; width: 342px; height: 420px; border-radius: 50%; background: radial-gradient(ellipse, rgba(232,185,138,.16) 0%, rgba(232,185,138,0) 62%)"></div>
    <div aria-hidden="true" style="position: absolute; left: 171px; top: 240px; width: 0; height: 0; transform-style: preserve-3d; transition: transform 2.1s cubic-bezier(.65,0,.3,1); transform: ${cam}">
      <div style="${ABS}; transform-style: preserve-3d; transform-origin: 0 150px; animation: ${jarAnim}">
        <${JarShadow} /><${JarGlass} />
        ${names.map((n, i) => html`<${Slip} name=${n} i=${i} o=${up && n === picked ? 0 : 1} anim=${shaking ? ((c % 2 ? 'jiggle' : 'jiggleB') + ' .3s ease-in-out ' + (i % 3) * 0.05 + 's 2') : 'none'} />`)}
        <span style="${ABS}; width: 110px; height: 40px; margin: -20px 0 0 -55px; border-radius: 50%; background: rgba(0,0,0,.6); filter: blur(8px); transition: opacity 1.8s ease, transform 1.8s ease; opacity: ${up ? (floating ? .12 : .7) : 0}; transform: translateY(149px) rotateX(90deg) scale(${floating ? .55 : 1})"></span>
        ${up ? html`
          <div style="${ABS}; transform-style: preserve-3d; transition: transform 2s cubic-bezier(.3,.7,.2,1); transform: ${lotT}">
            <div style="${ABS}; transform-style: preserve-3d; animation: ${floating ? 'lotbob 3s ease-in-out 2s infinite' : 'none'}">
              <div style="position: absolute; left: -95px; top: 0; width: 190px; height: 58px; transform-style: preserve-3d">
                <div style="position: absolute; inset: 0; overflow: hidden; border-radius: 0 0 3px 3px; background: linear-gradient(180deg, #FFF9F0 0%, #F6EADB 100%); box-shadow: 0 20px 34px rgba(0,0,0,.5)">
                  <div style="position: absolute; left: 0; top: -58px; width: 190px; height: 116px; ${lotName}">${picked}</div>
                  <span style="position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(180deg, rgba(120,80,50,.22), rgba(120,80,50,0))"></span>
                </div>
              </div>
              <div style="position: absolute; left: -95px; top: -58px; width: 190px; height: 58px; transform-style: preserve-3d; transform-origin: 50% 100%; transition: transform 1.1s cubic-bezier(.3,1.25,.4,1); transform: rotateX(${ph === 'open' ? 0 : -178}deg)">
                <div style="position: absolute; inset: 0; overflow: hidden; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, #FFF9F0 0%, #F6EADB 100%); backface-visibility: hidden; -webkit-backface-visibility: hidden">
                  <div style="position: absolute; left: 0; top: 0; width: 190px; height: 116px; ${lotName}">${picked}</div>
                  <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(0deg, rgba(120,80,50,.18), rgba(120,80,50,0))"></span>
                </div>
                <div style="position: absolute; inset: 0; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, #F3E6D5 0%, #E9D9C4 100%); transform: rotateX(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden"></div>
              </div>
            </div>
          </div>` : null}
        <${Glints} o=${up ? .25 : 1} />
        <div style="${ABS}; transform-style: preserve-3d; transform-origin: 0 -184px; animation: ${ph === 'shake' ? 'none' : 'lidoff 2s both'}"><${Lid} off=${ph !== 'shake'} /></div>
      </div>
    </div>
    ${ph === 'open' ? html`<${Burst} x=${171} y=${170} delay=${0.35} />` : null}
    <button type="button" aria-label="Schud de pot" onClick=${this.shake} style="position: absolute; left: 41px; top: 20px; width: 260px; height: 420px; padding: 0; border: 0; border-radius: 40px; background: transparent; cursor: pointer; pointer-events: ${ph === 'shake' && c < 3 ? 'auto' : 'none'}"></button>
  </div>
  ${ph !== 'open' ? html`
    <div style="display: flex; flex-direction: column; align-items: center; transition: opacity .6s; opacity: ${up ? .8 : 1}">
      <div style="display: flex; gap: 12px">${[0, 1, 2].map((k) => html`<span style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid ${C.gold}; box-sizing: border-box; transition: background .2s; background: ${k < c ? C.gold : 'transparent'}"></span>`)}</div>
      <p role="status" style="margin: 12px 0 0; font-size: 16px; font-weight: 600; text-align: center; animation: hint 1.6s ease-in-out infinite">${hint}</p>
    </div>` : html`
    <button type="button" onClick=${this.toProfiel} style="${BTN}; margin-top: auto; width: 100%; animation: fadeup .6s ease-out 1s both">Bekijk verlanglijstje van ${picked}</button>`}
</div>`;
  }

  renderProfiel() {
    const S = this.state, d = S.data.draw;
    if (!d) return null;
    const wishes = (d.wishes || []).filter(Boolean);
    return html`
<div style="position: absolute; inset: 0; padding: 52px 24px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; animation: fadein .35s both">
  <${Header} me=${S.data.me} onMe=${this.editWens} />
  <div style="border-radius: 28px; padding: 20px; display: flex; align-items: center; gap: 16px; background: ${C.cream}; color: ${C.wine}; animation: cardin .5s ease-out both">
    <${Avatar} name=${d.name} photo=${d.photo} size=${84} font=${36} />
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #8A3B2A">Jij koopt voor</span>
      <span style="font-size: ${d.name.length > 8 ? 32 : 38}px; line-height: 1; ${SERIF}">${d.name}</span>
      <span style="font-size: 13px; opacity: .75; display: flex; align-items: center; gap: 5px">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        Getrokken op ${fmtDate(d.drawn_at)}</span>
    </div>
  </div>
  <h2 style="margin: 4px 0 0; font-size: 14px; font-weight: 600; color: ${C.rose}">Verlanglijstje van ${d.name}</h2>
  ${wishes.length ? html`
  <ol style="flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
    ${wishes.map((t, i) => html`
      <li style="flex: none; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 12px; box-sizing: border-box; font-size: 15px; line-height: 1.35; background: rgba(0,0,0,.22); border: 1px solid ${C.line}; border-radius: 28px; overflow-wrap: anywhere; animation: cardin .4s ease-out ${0.1 + i * 0.04}s both">
        <span style="flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid ${C.line}; color: ${C.gold}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">${i + 1}</span>${t}
      </li>`)}
  </ol>` : html`
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 0 20px; color: ${C.rose}">
    <${Bow} size=${70} />
    <p style="margin: 0; font-size: 15px; line-height: 1.5">${d.name} heeft nog geen verlanglijstje gemaakt. Kom later nog eens kijken!</p>
  </div>`}
  <button type="button" onClick=${() => this.setState({ sheet: true })} style="flex: none; height: 52px; border-radius: 999px; border: 2px solid ${C.gold}; background: transparent; color: ${C.cream}; font: 600 15px 'DM Sans', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${C.gold}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg>
    Opnieuw trekken
  </button>
  <div style="display: flex; justify-content: space-between">
    <button type="button" onClick=${this.logout} style="height: 44px; padding: 0 4px; border: 0; background: none; color: ${C.rose}; font: 500 13px 'DM Sans', sans-serif; text-decoration: underline; cursor: pointer">Uitloggen</button>
    ${!LIVE ? html`<button type="button" onClick=${this.resetDemo} style="height: 44px; padding: 0 4px; border: 0; background: none; color: ${C.rose}; font: 500 13px 'DM Sans', sans-serif; text-decoration: underline; cursor: pointer">Demo opnieuw</button>` : null}
  </div>
</div>
${S.sheet ? html`
  <div onClick=${(e) => { if (e.target === e.currentTarget) this.setState({ sheet: false }); }} style="position: absolute; inset: 0; background: rgba(20,3,7,.78); display: flex; align-items: flex-end; animation: fadein .2s both">
    <div role="dialog" aria-label="Opnieuw trekken" style="width: 100%; background: ${C.cream}; color: ${C.wine}; border-radius: 28px 28px 0 0; padding: 26px 24px 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; animation: sheet .35s cubic-bezier(.3,.8,.3,1) both">
      <h2 style="margin: 0; font-size: 26px; ${SERIF}">Opnieuw trekken?</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #6B3A34">${d.name} gaat terug in de pot. Je krijgt een nieuwe naam uit de namen die nog niemand heeft getrokken. Dit kun je niet ongedaan maken.</p>
      <button type="button" onClick=${this.redraw} style="${BTN}; margin-top: 8px; background: ${C.wine}; color: ${C.cream}">Ja, trek opnieuw</button>
      <button type="button" onClick=${() => this.setState({ sheet: false })} style="height: 48px; border: 0; background: transparent; color: ${C.wine}; font: 600 15px 'DM Sans', sans-serif; cursor: pointer">Nee, ik houd ${d.name}</button>
    </div>
  </div>` : null}`;
  }
}

render(html`<${App} />`, document.getElementById('app'));

/* schaal het 390×844-scherm passend op elk apparaat.
   Niet herschalen terwijl het toetsenbord open is (input heeft focus). */
const fit = () => {
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT' && window.innerHeight < (fit.h || 0)) return;
  fit.h = window.innerHeight;
  const k = Math.min(window.innerWidth / 390, window.innerHeight / 844);
  document.getElementById('app').style.transform = 'scale(' + k + ')';
};
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 250));
fit();
</script>
</body>
</html>
