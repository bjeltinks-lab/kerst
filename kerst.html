<html lang="nl">
<head>

<style>
html,body{margin:0;height:100%;background:#16030A}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:390px;height:844px;flex:none;transform-origin:50% 50%;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
@media (max-width:500px){#app{border-radius:0;box-shadow:none}}
a{color:#FBEFE6}
input::placeholder{color:#D9B8AE;opacity:.85}
input:focus{outline:2px solid #E8B98A;outline-offset:1px}
button:focus-visible{outline:2px solid #E8B98A;outline-offset:2px}

@keyframes pop{0%{opacity:0;transform:translateY(40px) scale(.6) rotate(-6deg)}60%{opacity:1;transform:translateY(-6px) scale(1.06) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes shakeA{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg) translateX(-8px)}30%{transform:rotate(8deg) translateX(8px)}45%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
@keyframes shakeB{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg) translateX(8px)}30%{transform:rotate(-8deg) translateX(-8px)}45%{transform:rotate(7deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
@keyframes jiggle{0%,100%{translate:0 0}25%{translate:2px -6px}50%{translate:-3px 2px}75%{translate:3px -3px}}
@keyframes jiggleB{0%,100%{translate:0 0}25%{translate:-2px -5px}50%{translate:3px 3px}75%{translate:-3px -2px}}
@keyframes popOut{0%{opacity:0;transform:translateY(-140px) scale(.2) rotate(-30deg)}55%{opacity:1;transform:translateY(16px) scale(1.1) rotate(5deg)}100%{opacity:1;transform:none}}
@keyframes rays{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes hint{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.07)}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(880px)}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,80px) scale(1.25)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(40px) scale(.45);filter:brightness(.6)}60%{opacity:1}100%{opacity:1;transform:translateY(-6px) scale(1.25);filter:brightness(1)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes lotshadow{0%{opacity:.9;transform:scale(1.1)}100%{opacity:.35;transform:scale(.6)}}
@keyframes unfold{0%{opacity:0;transform:rotateX(-88deg) scale(.5)}60%{opacity:1;transform:rotateX(12deg) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes lotbob{0%,100%{transform:translate3d(0,0,0) rotateZ(-2deg)}50%{transform:translate3d(0,-10px,0) rotateZ(2deg)}}
@keyframes cardin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

</style>
</head>

          this.timers.push(setTimeout(() => this.setState({ phase: 'above' }), 1550));
          this.timers.push(setTimeout(() => this.setState({ phase: 'float' }), 3500));
          this.timers.push(setTimeout(() => this.setState({ phase: 'open' }), 5500));
        }
      },
      revealed: S.revealed, picked, initial: picked.charAt(0),
      toProfiel: () => this.setState({ screen: 'profiel', revealed: false, phase: 'shake', count: 0 }),
      profWishes: wishList.map((t, i) => ({ n: i + 1, t })),
      sheet: S.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false }),
      redraw: () => this.setState({ sheet: false, exclude: S.picked, picked: '', screen: 'pot', count: 0, revealed: false, phase: 'shake' }),
      logout: () => this.setState({ screen: 'login', sheet: false }),
      reset: () => { this.timers.forEach(clearTimeout); this.setState(Object.assign({}, this.init)); }
    };
  }
}

render(html`<${App} />`, document.getElementById('app'));

// schaal het 390×844-scherm passend op elk apparaat
const fit = () => {
  const el = document.getElementById('app');
  const k = Math.min(window.innerWidth / 390, window.innerHeight / 844);
  el.style.transform = 'scale(' + k + ')';
};
window.addEventListener('resize', fit); fit();
</script>
